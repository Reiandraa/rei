name: macOS beta

on:
  workflow_dispatch:
  push:
    branches: [rei-os-desktop]
    paths: [.github/workflows/macos-beta.yml]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check interface and tests
        run: |
          npm run lint
          npm run test:unit
          npm run test:e2e
          node scripts/tools/check-ipc-schema.mjs
      - name: Build Apple Silicon and Intel beta
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg --config tauri.macos-beta.conf.json
      - name: Verify bundle and prepare download
        run: |
          set -eu
          app='src-tauri/target/universal-apple-darwin/release/bundle/macos/REI OS.app'
          codesign --verify --deep --strict "$app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/rei-os"
          mkdir -p beta-artifacts
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -exec cp '{}' beta-artifacts/REI-OS-macOS-universal.dmg \;
          test -s beta-artifacts/REI-OS-macOS-universal.dmg
          cd beta-artifacts
          shasum -a 256 REI-OS-macOS-universal.dmg > SHA256-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: REI-OS-macOS-beta
          path: desktop/beta-artifacts/*
          if-no-files-found: error
          retention-days: 30
